<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101318">
  <title>French Learning Suite · Je verbs</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: rgba(255, 255, 255, 0.9);
      --surface: #ffffff;
      --soft: #eef2f7;
      --text: #111827;
      --muted: #667085;
      --line: rgba(17, 24, 39, 0.1);
      --blue: #2563eb;
      --blue-strong: #1d4ed8;
      --green: #059669;
      --orange: #f97316;
      --red: #dc2626;
      --shadow: 0 22px 44px -30px rgba(15, 23, 42, 0.48);
      --radius: 8px;
      --font-ui: "Avenir Next", "Segoe UI", "Noto Sans", system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #101318;
      --panel: rgba(22, 27, 34, 0.9);
      --surface: #161b22;
      --soft: #202733;
      --text: #f7f8fb;
      --muted: #aab3c2;
      --line: rgba(255, 255, 255, 0.11);
      --blue: #60a5fa;
      --blue-strong: #3b82f6;
      --green: #34d399;
      --red: #f87171;
      --shadow: 0 24px 48px -30px rgba(0, 0, 0, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      font-kerning: normal;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-ui);
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0, rgba(96, 165, 250, 0.24), transparent 30rem),
        linear-gradient(180deg, rgba(249, 115, 22, 0.09), transparent 24rem),
        var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px 14px 42px;
      display: grid;
      gap: 14px;
    }

    .suite,
    .hero,
    .panel,
    .card,
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    .suite,
    .tabs,
    .actions,
    .chips {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .suite {
      justify-content: space-between;
      padding: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
    }

    .badge::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--orange));
      box-shadow: 0 0 0 6px rgba(96, 165, 250, 0.12);
      flex: 0 0 auto;
    }

    .hero {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      letter-spacing: -0.02em;
      font-weight: 800;
    }

    h2,
    h3 {
      letter-spacing: -0.01em;
    }

    .subtitle {
      max-width: 72ch;
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.5;
    }

    .btn,
    .tab,
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border-radius: var(--radius);
      padding: 10px 13px;
      cursor: pointer;
      font-weight: 750;
      color: var(--text);
      background: var(--soft);
      border: 1px solid var(--line);
      text-decoration: none;
      transition: transform 140ms ease, background 140ms ease, color 140ms ease, border-color 140ms ease;
    }

    .btn:hover,
    .tab:hover,
    .chip:hover,
    .card:hover {
      transform: translateY(-1px);
    }

    .primary,
    .tab[aria-selected="true"],
    .chip[aria-pressed="true"] {
      background: var(--blue-strong);
      border-color: var(--blue-strong);
      color: #fff;
    }

    .ghost {
      background: transparent;
    }

    .good {
      background: color-mix(in srgb, var(--green) 14%, var(--surface));
      color: var(--green);
    }

    .bad {
      background: color-mix(in srgb, var(--red) 12%, var(--surface));
      color: var(--red);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      padding: 14px;
    }

    .label {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .value {
      display: block;
      margin-top: 5px;
      font-size: 1.45rem;
      font-weight: 800;
    }

    .panel {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .card {
      text-align: left;
      display: grid;
      gap: 10px;
      padding: 14px;
      color: var(--text);
      cursor: pointer;
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
    }

    .muted {
      color: var(--muted);
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--soft);
    }

    .fill {
      width: var(--value, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green));
      transition: width 180ms ease;
    }

    .detail {
      display: grid;
      gap: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    th,
    td {
      padding: 11px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th {
      color: var(--muted);
      font-size: 0.86rem;
      background: var(--soft);
    }

    .form {
      font-weight: 800;
    }

    .list {
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .list li,
    .feedback,
    .train-card {
      padding: 11px;
      border-radius: var(--radius);
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .train-card {
      min-height: 260px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 16px;
      text-align: center;
      background: var(--surface);
      padding: 24px;
    }

    .prompt {
      display: grid;
      gap: 6px;
    }

    .prompt-main {
      font-size: clamp(1.55rem, 5vw, 2.8rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      font-weight: 800;
    }

    .input-row {
      width: min(520px, 100%);
      display: grid;
      gap: 8px;
    }

    .input,
    .select {
      width: 100%;
      min-height: 46px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    .input:focus,
    .select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 18%, transparent);
    }

    .choice,
    .match {
      display: grid;
      gap: 10px;
      width: min(720px, 100%);
    }

    .choice {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

    .match-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .ok {
      color: var(--green);
      font-weight: 800;
    }

    .no {
      color: var(--red);
      font-weight: 800;
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 780px) {
      .hero {
        padding: 18px;
      }

      .stats {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .detail {
        grid-template-columns: minmax(0, 1.15fr) minmax(260px, 0.85fr);
      }

      .match-row {
        grid-template-columns: minmax(0, 1fr) minmax(220px, 0.8fr);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="suite">
      <a class="badge" href="https://polpal1623.github.io/FrenchLibrary/">French Learning Suite</a>
      <div class="actions">
        <a class="btn ghost" href="https://polpal1623.github.io/FrenchLibrary/">Все приложения</a>
        <a class="btn ghost" href="https://github.com/PolPal1623/JeVerbs">GitHub</a>
      </div>
    </div>

    <header class="hero">
      <div class="hero-top">
        <div>
          <h1>Je verbs</h1>
          <p class="subtitle">10 базовых французских глаголов уровня A1-A2, 5 времён и только формы с <strong>je</strong>, чтобы быстрее довести их до автоматизма.</p>
        </div>
        <div class="actions">
          <button class="btn" id="themeBtn" type="button" aria-pressed="true">Тема</button>
          <button class="btn ghost" id="resetBtn" type="button">Сброс</button>
        </div>
      </div>
      <nav class="tabs" aria-label="Разделы">
        <button class="tab" type="button" data-view="dashboard" aria-selected="true">Глаголы</button>
        <button class="tab" type="button" data-view="training" aria-selected="false">Тренировка</button>
        <button class="tab" type="button" data-view="test" aria-selected="false">Мини-тест</button>
        <button class="tab" type="button" data-view="progress" aria-selected="false">Прогресс</button>
      </nav>
    </header>

    <section class="stats" aria-label="Сводка прогресса">
      <article class="stat"><span class="label">Выучено</span><strong class="value" id="learnedStat">0%</strong></article>
      <article class="stat"><span class="label">Форм</span><strong class="value" id="formsStat">0/50</strong></article>
      <article class="stat"><span class="label">Ошибок</span><strong class="value" id="errorsStat">0</strong></article>
      <article class="stat"><span class="label">Streak</span><strong class="value" id="streakStat">0 дней</strong></article>
    </section>

    <section class="panel" id="dashboardView"></section>
    <section class="panel" id="detailView" hidden></section>
    <section class="panel" id="trainingView" hidden></section>
    <section class="panel" id="testView" hidden></section>
    <section class="panel" id="progressView" hidden></section>
  </main>

  <script>
    const TENSES = [
      ["present", "Présent"],
      ["futurProche", "Futur proche"],
      ["passeCompose", "Passé composé"],
      ["imparfait", "Imparfait"],
      ["futurSimple", "Futur simple"]
    ];

    const VERBS = [
      { id: "etre", inf: "être", ru: "быть", f: { present: ["je suis", "я есть / являюсь", "Je suis prêt.", "Я готов."], futurProche: ["je vais être", "я собираюсь быть", "Je vais être à la maison.", "Я буду дома."], passeCompose: ["j'ai été", "я был(а)", "J'ai été malade.", "Я был болен."], imparfait: ["j'étais", "я был(а)", "J'étais fatigué.", "Я был уставшим."], futurSimple: ["je serai", "я буду", "Je serai là demain.", "Я буду там завтра."] } },
      { id: "avoir", inf: "avoir", ru: "иметь", f: { present: ["j'ai", "у меня есть", "J'ai un livre.", "У меня есть книга."], futurProche: ["je vais avoir", "у меня скоро будет", "Je vais avoir le temps.", "У меня будет время."], passeCompose: ["j'ai eu", "у меня было", "J'ai eu une idée.", "У меня появилась идея."], imparfait: ["j'avais", "у меня было", "J'avais froid.", "Мне было холодно."], futurSimple: ["j'aurai", "у меня будет", "J'aurai besoin d'aide.", "Мне понадобится помощь."] } },
      { id: "aller", inf: "aller", ru: "идти / ехать", f: { present: ["je vais", "я иду / еду", "Je vais au travail.", "Я иду на работу."], futurProche: ["je vais aller", "я собираюсь пойти", "Je vais aller au marché.", "Я собираюсь пойти на рынок."], passeCompose: ["je suis allé(e)", "я сходил(а) / ездил(а)", "Je suis allé au parc.", "Я ходил в парк."], imparfait: ["j'allais", "я ходил(а) / шёл", "J'allais souvent ici.", "Я часто ходил сюда."], futurSimple: ["j'irai", "я пойду / поеду", "J'irai demain.", "Я пойду завтра."] } },
      { id: "faire", inf: "faire", ru: "делать", f: { present: ["je fais", "я делаю", "Je fais mes devoirs.", "Я делаю домашнее задание."], futurProche: ["je vais faire", "я собираюсь сделать", "Je vais faire le dîner.", "Я собираюсь приготовить ужин."], passeCompose: ["j'ai fait", "я сделал(а)", "J'ai fait une pause.", "Я сделал перерыв."], imparfait: ["je faisais", "я делал(а)", "Je faisais du sport.", "Я занимался спортом."], futurSimple: ["je ferai", "я сделаю", "Je ferai attention.", "Я буду внимателен."] } },
      { id: "dire", inf: "dire", ru: "сказать / говорить", f: { present: ["je dis", "я говорю", "Je dis la vérité.", "Я говорю правду."], futurProche: ["je vais dire", "я собираюсь сказать", "Je vais dire bonjour.", "Я собираюсь поздороваться."], passeCompose: ["j'ai dit", "я сказал(а)", "J'ai dit merci.", "Я сказал спасибо."], imparfait: ["je disais", "я говорил(а)", "Je disais la même chose.", "Я говорил то же самое."], futurSimple: ["je dirai", "я скажу", "Je dirai oui.", "Я скажу да."] } },
      { id: "devoir", inf: "devoir", ru: "быть должным", f: { present: ["je dois", "я должен / должна", "Je dois partir.", "Я должен уйти."], futurProche: ["je vais devoir", "мне придётся", "Je vais devoir attendre.", "Мне придётся ждать."], passeCompose: ["j'ai dû", "мне пришлось", "J'ai dû partir tôt.", "Мне пришлось уйти рано."], imparfait: ["je devais", "я должен был", "Je devais travailler.", "Я должен был работать."], futurSimple: ["je devrai", "я должен буду", "Je devrai choisir.", "Я должен буду выбрать."] } },
      { id: "pouvoir", inf: "pouvoir", ru: "мочь", f: { present: ["je peux", "я могу", "Je peux aider.", "Я могу помочь."], futurProche: ["je vais pouvoir", "я скоро смогу", "Je vais pouvoir venir.", "Я смогу прийти."], passeCompose: ["j'ai pu", "я смог(ла)", "J'ai pu finir.", "Я смог закончить."], imparfait: ["je pouvais", "я мог(ла)", "Je pouvais comprendre.", "Я мог понять."], futurSimple: ["je pourrai", "я смогу", "Je pourrai répondre.", "Я смогу ответить."] } },
      { id: "vouloir", inf: "vouloir", ru: "хотеть", f: { present: ["je veux", "я хочу", "Je veux apprendre.", "Я хочу учиться."], futurProche: ["je vais vouloir", "я захочу", "Je vais vouloir essayer.", "Я захочу попробовать."], passeCompose: ["j'ai voulu", "я захотел(а)", "J'ai voulu comprendre.", "Я захотел понять."], imparfait: ["je voulais", "я хотел(а)", "Je voulais rester.", "Я хотел остаться."], futurSimple: ["je voudrai", "я захочу", "Je voudrai parler.", "Я захочу поговорить."] } },
      { id: "savoir", inf: "savoir", ru: "знать / уметь", f: { present: ["je sais", "я знаю / умею", "Je sais nager.", "Я умею плавать."], futurProche: ["je vais savoir", "я узнаю", "Je vais savoir la réponse.", "Я узнаю ответ."], passeCompose: ["j'ai su", "я узнал(а)", "J'ai su la nouvelle.", "Я узнал новость."], imparfait: ["je savais", "я знал(а)", "Je savais déjà.", "Я уже знал."], futurSimple: ["je saurai", "я буду знать", "Je saurai quoi faire.", "Я буду знать, что делать."] } },
      { id: "prendre", inf: "prendre", ru: "брать", f: { present: ["je prends", "я беру", "Je prends un café.", "Я беру кофе."], futurProche: ["je vais prendre", "я собираюсь взять", "Je vais prendre le bus.", "Я собираюсь сесть на автобус."], passeCompose: ["j'ai pris", "я взял(а)", "J'ai pris une photo.", "Я сделал фото."], imparfait: ["je prenais", "я брал(а)", "Je prenais le train.", "Я ездил на поезде."], futurSimple: ["je prendrai", "я возьму", "Je prendrai rendez-vous.", "Я запишусь на встречу."] } }
    ];

    const STORE = "jeVerbsProgress.v2";
    const THEME = "jeVerbsTheme.v2";
    const TOTAL = VERBS.length * TENSES.length;
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => Array.from(document.querySelectorAll(selector));
    const views = {
      dashboard: $("#dashboardView"),
      detail: $("#detailView"),
      training: $("#trainingView"),
      test: $("#testView"),
      progress: $("#progressView")
    };
    const state = {
      view: "dashboard",
      verb: "etre",
      mode: "flash",
      hard: false,
      revealed: false,
      item: null,
      test: null,
      data: load()
    };

    function key(verbId, tenseId) {
      return `${verbId}|${tenseId}`;
    }

    function pct(value, total) {
      return total ? Math.round((value / total) * 100) : 0;
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function all() {
      return VERBS.flatMap((verb) => TENSES.map(([id, label]) => {
        const form = verb.f[id];
        return {
          key: key(verb.id, id),
          verb,
          tense: { id, label },
          data: { form: form[0], ru: form[1], example: form[2], exampleRu: form[3] }
        };
      }));
    }

    function load() {
      const base = { records: {}, streak: { count: 0, last: null } };
      try {
        return Object.assign(base, JSON.parse(localStorage.getItem(STORE) || "{}"));
      } catch {
        return base;
      }
    }

    function save() {
      localStorage.setItem(STORE, JSON.stringify(state.data));
      updateStats();
    }

    function rec(itemKey) {
      if (!state.data.records[itemKey]) {
        state.data.records[itemKey] = { correct: 0, errors: 0, attempts: 0, ease: 2.5, interval: 0, due: 0, last: "" };
      }
      return state.data.records[itemKey];
    }

    function touchStreak() {
      const streak = state.data.streak;
      const current = today();
      if (streak.last === current) return;
      if (!streak.last) {
        streak.count = 1;
      } else {
        const previousDate = new Date(streak.last);
        const currentDate = new Date(current);
        streak.count = (currentDate - previousDate) / 86400000 <= 1.5 ? streak.count + 1 : 1;
      }
      streak.last = current;
    }

    function learned() {
      return all().filter((item) => {
        const record = rec(item.key);
        return record.correct >= 3 && record.interval >= 3;
      }).length;
    }

    function updateStats() {
      const items = all();
      const errors = items.reduce((sum, item) => sum + rec(item.key).errors, 0);
      const done = learned();
      $("#learnedStat").textContent = `${pct(done, TOTAL)}%`;
      $("#formsStat").textContent = `${done}/${TOTAL}`;
      $("#errorsStat").textContent = errors;
      $("#streakStat").textContent = `${state.data.streak.count || 0} дней`;
    }

    function review(item, quality, answer = "") {
      const record = rec(item.key);
      touchStreak();
      record.attempts += 1;
      record.last = today();
      if (quality >= 4) {
        record.correct += 1;
        record.ease = Math.max(1.3, record.ease + 0.08);
        record.interval = record.interval ? Math.ceil(record.interval * record.ease) : 1;
      } else {
        record.errors += 1;
        record.correct = 0;
        record.ease = Math.max(1.3, record.ease - 0.22);
        record.interval = 0;
        record.lastWrong = answer;
      }
      record.due = Date.now() + Math.max(1, record.interval) * 86400000;
      save();
    }

    function normalize(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[’']/g, "'")
        .replace(/\(e\)/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function isCorrect(item, value) {
      return normalize(value) === normalize(item.data.form);
    }

    function pool() {
      const items = all();
      const now = Date.now();
      const due = items.filter((item) => rec(item.key).due <= now);
      const hard = items.filter((item) => rec(item.key).errors > 0 || rec(item.key).ease < 2.25);
      return state.hard ? (hard.length ? hard : items) : (due.length ? due : items);
    }

    function pick() {
      const items = pool();
      return items[Math.floor(Math.random() * items.length)];
    }

    function setView(view) {
      state.view = view;
      Object.values(views).forEach((node) => {
        node.hidden = true;
      });
      views[view].hidden = false;
      $$(".tab").forEach((button) => {
        button.setAttribute("aria-selected", String(button.dataset.view === view));
      });
      if (view === "dashboard") renderDashboard();
      if (view === "detail") renderDetail();
      if (view === "training") renderTraining();
      if (view === "test") renderTestStart();
      if (view === "progress") renderProgress();
    }

    function renderDashboard() {
      views.dashboard.innerHTML = `
        <div class="panel-head">
          <div>
            <h2>Dashboard</h2>
            <p class="muted">Выберите глагол и закрепляйте только je-формы.</p>
          </div>
          <button class="btn primary" type="button" data-start>Начать тренировку</button>
        </div>
        <div class="grid">${VERBS.map(renderCard).join("")}</div>
      `;
      views.dashboard.querySelector("[data-start]").addEventListener("click", () => setView("training"));
      views.dashboard.querySelectorAll("[data-verb]").forEach((button) => {
        button.addEventListener("click", () => {
          state.verb = button.dataset.verb;
          setView("detail");
        });
      });
    }

    function renderCard(verb) {
      const done = TENSES.filter(([id]) => {
        const record = rec(key(verb.id, id));
        return record.correct >= 3 && record.interval >= 3;
      }).length;
      return `
        <button class="card" type="button" data-verb="${verb.id}">
          <span class="card-title"><strong>${verb.inf}</strong><span class="muted">${verb.ru}</span></span>
          <span class="bar"><span class="fill" style="--value:${pct(done, TENSES.length)}%"></span></span>
          <span class="muted">${done}/${TENSES.length} форм закреплено</span>
        </button>
      `;
    }

    function renderDetail() {
      const verb = VERBS.find((item) => item.id === state.verb) || VERBS[0];
      views.detail.innerHTML = `
        <div class="panel-head">
          <div>
            <h2>${verb.inf}</h2>
            <p class="muted">${verb.ru} · только формы с je</p>
          </div>
          <div class="actions">
            <button class="btn ghost" type="button" data-back>Назад</button>
            <button class="btn primary" type="button" data-add>Добавить в тренировку</button>
          </div>
        </div>
        <div class="detail">
          <table>
            <thead><tr><th>Время</th><th>Форма</th><th>Перевод</th><th></th></tr></thead>
            <tbody>
              ${TENSES.map(([id, label]) => `
                <tr>
                  <td>${label}</td>
                  <td class="form">${verb.f[id][0]}</td>
                  <td>${verb.f[id][1]}</td>
                  <td><button class="btn ghost" type="button" data-say="${verb.f[id][0]}">Прослушать</button></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
          <div>
            <h3>Примеры</h3>
            <ul class="list">${TENSES.map(([id]) => `<li><strong>${verb.f[id][2]}</strong><br><span class="muted">${verb.f[id][3]}</span></li>`).join("")}</ul>
          </div>
        </div>
      `;
      views.detail.querySelector("[data-back]").addEventListener("click", () => setView("dashboard"));
      views.detail.querySelector("[data-add]").addEventListener("click", () => {
        state.hard = false;
        setView("training");
      });
      views.detail.querySelectorAll("[data-say]").forEach((button) => {
        button.addEventListener("click", () => speak(button.dataset.say));
      });
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text.replace("(e)", ""));
      utterance.lang = "fr-FR";
      utterance.rate = 0.88;
      speechSynthesis.speak(utterance);
    }

    function renderTraining() {
      state.item = state.item || pick();
      views.training.innerHTML = `
        <div class="panel-head">
          <div>
            <h2>Training Mode</h2>
            <p class="muted">${pool().length} форм в очереди</p>
          </div>
          <div class="chips">
            <button class="chip" type="button" data-mode="flash" aria-pressed="${state.mode === "flash"}">Flashcards</button>
            <button class="chip" type="button" data-mode="reverse" aria-pressed="${state.mode === "reverse"}">Reverse</button>
            <button class="chip" type="button" data-mode="input" aria-pressed="${state.mode === "input"}">Input</button>
            <button class="chip" type="button" data-hard aria-pressed="${state.hard}">Сложные</button>
          </div>
        </div>
        <div class="train-card" id="trainCard"></div>
      `;
      views.training.querySelectorAll("[data-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          state.mode = button.dataset.mode;
          state.revealed = false;
          state.item = pick();
          renderTraining();
        });
      });
      views.training.querySelector("[data-hard]").addEventListener("click", () => {
        state.hard = !state.hard;
        state.revealed = false;
        state.item = pick();
        renderTraining();
      });
      renderTrainingCard(state.item);
    }

    function renderTrainingCard(item) {
      const card = $("#trainCard");
      if (state.mode === "input") {
        card.innerHTML = `
          <div class="prompt">
            <span class="muted">${item.verb.inf} · ${item.tense.label}</span>
            <span class="prompt-main">${item.data.ru}</span>
            <span class="muted">Введите французскую je-форму</span>
          </div>
          <form class="input-row" id="answerForm">
            <input class="input" name="answer" autocomplete="off" autocapitalize="none" spellcheck="false" required>
            <button class="btn primary" type="submit">Проверить</button>
          </form>
          <div class="feedback" id="feedback" hidden></div>
        `;
        $("#answerForm").addEventListener("submit", (event) => {
          event.preventDefault();
          const value = event.currentTarget.elements.answer.value;
          const ok = isCorrect(item, value);
          review(item, ok ? 5 : 2, value);
          $("#feedback").hidden = false;
          $("#feedback").innerHTML = ok
            ? `<span class="ok">Верно.</span> ${item.data.form}`
            : `<span class="no">Ошибка.</span> Правильно: <strong>${item.data.form}</strong>`;
          setTimeout(nextTraining, ok ? 700 : 1300);
        });
        card.querySelector("input").focus();
        return;
      }

      const front = state.mode === "flash" ? item.data.form : `${item.verb.ru} · ${item.data.ru}`;
      if (!state.revealed) {
        card.innerHTML = `
          <div class="prompt">
            <span class="muted">${item.verb.inf} · ${item.tense.label}</span>
            <span class="prompt-main">${front}</span>
            <span class="muted">${state.mode === "flash" ? "Вспомните перевод" : "Вспомните французскую форму"}</span>
          </div>
          <div class="actions">
            <button class="btn primary" type="button" data-show>Показать</button>
            <button class="btn ghost" type="button" data-say>Прослушать</button>
          </div>
        `;
        card.querySelector("[data-show]").addEventListener("click", () => {
          state.revealed = true;
          renderTrainingCard(item);
        });
        card.querySelector("[data-say]").addEventListener("click", () => speak(item.data.form));
        return;
      }

      card.innerHTML = `
        <div class="prompt">
          <span class="muted">${item.verb.inf} · ${item.tense.label}</span>
          <span class="prompt-main">${item.data.form}</span>
          <span class="muted">${item.data.ru}</span>
        </div>
        <div class="actions">
          <button class="btn bad" type="button" data-quality="2">Сложно</button>
          <button class="btn good" type="button" data-quality="4">Помню</button>
          <button class="btn primary" type="button" data-quality="5">Легко</button>
          <button class="btn ghost" type="button" data-say>Прослушать</button>
        </div>
      `;
      card.querySelectorAll("[data-quality]").forEach((button) => {
        button.addEventListener("click", () => {
          review(item, Number(button.dataset.quality));
          nextTraining();
        });
      });
      card.querySelector("[data-say]").addEventListener("click", () => speak(item.data.form));
    }

    function nextTraining() {
      state.item = pick();
      state.revealed = false;
      renderTraining();
    }

    function shuffle(items) {
      const copy = items.slice();
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swap = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swap]] = [copy[swap], copy[index]];
      }
      return copy;
    }

    function question(type = null) {
      return { type: type || ["choice", "input", "match"][Math.floor(Math.random() * 3)], item: all()[Math.floor(Math.random() * TOTAL)] };
    }

    function renderTestStart() {
      views.test.innerHTML = `
        <div class="panel-head">
          <div>
            <h2>Мини-тест</h2>
            <p class="muted">Смешанные вопросы по всем je-формам.</p>
          </div>
          <div class="actions">
            <button class="btn primary" type="button" data-count="5">5 вопросов</button>
            <button class="btn" type="button" data-count="10">10 вопросов</button>
          </div>
        </div>
      `;
      views.test.querySelectorAll("[data-count]").forEach((button) => {
        button.addEventListener("click", () => startTest(Number(button.dataset.count)));
      });
    }

    function startTest(count) {
      state.test = {
        count,
        index: 0,
        score: 0,
        questions: Array.from({ length: count }, (_, index) => question(index % 3 === 2 ? "match" : null)),
        answers: []
      };
      renderTestQuestion();
    }

    function renderTestQuestion() {
      const test = state.test;
      if (!test || test.index >= test.questions.length) {
        renderTestResult();
        return;
      }
      const current = test.questions[test.index];
      const item = current.item;
      const head = `
        <div class="panel-head">
          <div>
            <h2>Вопрос ${test.index + 1}/${test.count}</h2>
            <p class="muted">${item.verb.inf} · ${item.tense.label}</p>
          </div>
        </div>
      `;

      if (current.type === "choice") {
        const choices = shuffle([item.data.form, ...shuffle(all().filter((row) => row.key !== item.key)).slice(0, 3).map((row) => row.data.form)]);
        views.test.innerHTML = `
          ${head}
          <div class="train-card">
            <div class="prompt">
              <span class="prompt-main">${item.data.ru}</span>
              <span class="muted">Выберите французскую форму</span>
            </div>
            <div class="choice">${choices.map((choice) => `<button class="btn" type="button" data-choice="${choice}">${choice}</button>`).join("")}</div>
            <div class="feedback" id="testFeedback" hidden></div>
          </div>
        `;
        views.test.querySelectorAll("[data-choice]").forEach((button) => {
          button.addEventListener("click", () => answerTest(button.dataset.choice === item.data.form, button.dataset.choice));
        });
        return;
      }

      if (current.type === "match") {
        const rows = shuffle(all()).slice(0, 3);
        const options = shuffle(rows.map((row) => row.data.form));
        views.test.innerHTML = `
          ${head}
          <div class="train-card">
            <div class="prompt">
              <span class="prompt-main">Сопоставление</span>
              <span class="muted">Подберите форму к каждому переводу</span>
            </div>
            <form class="match" id="matchForm">
              ${rows.map((row, index) => `
                <label class="match-row">
                  <span>${row.verb.inf} · ${row.tense.label}<br><strong>${row.data.ru}</strong></span>
                  <select class="select" name="match${index}" data-key="${row.key}">
                    <option value="">Выберите форму</option>
                    ${options.map((option) => `<option value="${option}">${option}</option>`).join("")}
                  </select>
                </label>
              `).join("")}
              <button class="btn primary" type="submit">Проверить</button>
            </form>
            <div class="feedback" id="testFeedback" hidden></div>
          </div>
        `;
        $("#matchForm").addEventListener("submit", (event) => {
          event.preventDefault();
          const selects = Array.from(event.currentTarget.querySelectorAll("select"));
          const ok = selects.every((select) => {
            const target = all().find((row) => row.key === select.dataset.key);
            return target && select.value === target.data.form;
          });
          selects.forEach((select) => {
            const target = all().find((row) => row.key === select.dataset.key);
            if (target) review(target, select.value === target.data.form ? 5 : 2, select.value);
          });
          answerTest(ok, "match", true);
        });
        return;
      }

      views.test.innerHTML = `
        ${head}
        <div class="train-card">
          <div class="prompt">
            <span class="prompt-main">${item.data.ru}</span>
            <span class="muted">Введите французскую je-форму</span>
          </div>
          <form class="input-row" id="testInput">
            <input class="input" name="answer" autocomplete="off" autocapitalize="none" spellcheck="false" required>
            <button class="btn primary" type="submit">Проверить</button>
          </form>
          <div class="feedback" id="testFeedback" hidden></div>
        </div>
      `;
      $("#testInput").addEventListener("submit", (event) => {
        event.preventDefault();
        answerTest(isCorrect(item, event.currentTarget.elements.answer.value), event.currentTarget.elements.answer.value);
      });
      views.test.querySelector("input").focus();
    }

    function answerTest(ok, answer, skipReview = false) {
      const test = state.test;
      const current = test.questions[test.index];
      const item = current.item;
      test.answers.push({ ok, answer, correct: item.data.form, item });
      if (ok) test.score += 1;
      if (!skipReview) review(item, ok ? 5 : 2, String(answer || ""));
      const feedback = $("#testFeedback");
      feedback.hidden = false;
      feedback.innerHTML = current.type === "match"
        ? (ok ? `<span class="ok">Верно.</span>` : `<span class="no">Есть ошибки в сопоставлении.</span>`)
        : (ok ? `<span class="ok">Верно.</span>` : `<span class="no">Ошибка.</span> Правильно: <strong>${item.data.form}</strong>`);
      setTimeout(() => {
        test.index += 1;
        renderTestQuestion();
      }, ok ? 700 : 1400);
    }

    function renderTestResult() {
      const test = state.test;
      views.test.innerHTML = `
        <div class="panel-head">
          <div>
            <h2>Результат</h2>
            <p class="muted">${test.score}/${test.count} правильных ответов</p>
          </div>
          <button class="btn primary" type="button" data-again>Ещё тест</button>
        </div>
        <ul class="list">
          ${test.answers.map((answer, index) => `
            <li>
              <strong>${index + 1}. ${answer.item.verb.inf} · ${answer.item.tense.label}</strong><br>
              <span class="${answer.ok ? "ok" : "no"}">${answer.ok ? "верно" : "ошибка"}</span>
              <span class="muted"> · ${answer.correct}</span>
            </li>
          `).join("")}
        </ul>
      `;
      views.test.querySelector("[data-again]").addEventListener("click", renderTestStart);
    }

    function renderProgress() {
      const hard = all()
        .map((item) => ({ item, record: rec(item.key) }))
        .filter(({ record }) => record.errors > 0 || record.ease < 2.25)
        .sort((a, b) => b.record.errors - a.record.errors)
        .slice(0, 10);
      views.progress.innerHTML = `
        <div class="panel-head">
          <div>
            <h2>Прогресс</h2>
            <p class="muted">Выучено ${learned()} из ${TOTAL} форм.</p>
          </div>
          <button class="btn primary" type="button" data-hard-training>Только сложные</button>
        </div>
        <div class="bar"><span class="fill" style="--value:${pct(learned(), TOTAL)}%"></span></div>
        <h3>Статистика ошибок</h3>
        <ul class="list">
          ${hard.length ? hard.map(({ item, record }) => `
            <li>
              <strong>${item.data.form}</strong> · ${item.verb.inf} · ${item.tense.label}<br>
              <span class="muted">Ошибок: ${record.errors}, попыток: ${record.attempts}, ease: ${record.ease.toFixed(2)}</span>
            </li>
          `).join("") : `<li>Ошибок пока нет.</li>`}
        </ul>
      `;
      views.progress.querySelector("[data-hard-training]").addEventListener("click", () => {
        state.hard = true;
        state.item = pick();
        setView("training");
      });
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#101318" : "#f6f7fb");
      $("#themeBtn").setAttribute("aria-pressed", String(theme === "dark"));
      localStorage.setItem(THEME, theme);
    }

    $$(".tab").forEach((button) => {
      button.addEventListener("click", () => setView(button.dataset.view));
    });

    $("#themeBtn").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });

    $("#resetBtn").addEventListener("click", () => {
      if (!confirm("Сбросить локальный прогресс Je verbs?")) return;
      localStorage.removeItem(STORE);
      state.data = load();
      state.item = null;
      updateStats();
      setView("dashboard");
    });

    applyTheme(localStorage.getItem(THEME) || "dark");
    updateStats();
    renderDashboard();

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
