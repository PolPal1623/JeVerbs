  <style>
    :root{color-scheme:dark;--bg:#101318;--panel:rgba(22,27,34,.9);--surface:#161b22;--soft:#202733;--text:#f7f8fb;--muted:#aab3c2;--line:rgba(255,255,255,.11);--blue:#60a5fa;--blue2:#2563eb;--green:#34d399;--orange:#fb923c;--red:#f87171;--shadow:0 24px 48px -30px rgba(0,0,0,.72);--radius:8px;--font:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:var(--font);color:var(--text);background:radial-gradient(circle at 12% 0,rgba(96,165,250,.24),transparent 30rem),linear-gradient(180deg,rgba(251,146,60,.08),transparent 24rem),var(--bg)}button,input,select{font:inherit}button{border:0}.app{width:min(1180px,100%);margin:auto;padding:18px 14px 44px;display:grid;gap:14px}.suite,.hero,.panel,.card,.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.suite,.row,.tabs,.actions,.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.suite{justify-content:space-between;padding:12px}.badge{color:var(--text);text-decoration:none;font-weight:850}.badge:before{content:"";display:inline-block;width:12px;height:12px;margin-right:10px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--orange));box-shadow:0 0 0 6px rgba(96,165,250,.12);vertical-align:-1px}.hero{padding:16px;display:grid;gap:12px}.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}h1,h2,h3,p{margin:0}h1{font-size:clamp(2rem,7vw,4.6rem);line-height:.92;letter-spacing:-.06em}.sub{max-width:72ch;color:var(--muted);line-height:1.45}.btn,.tab,.chip{min-height:40px;border-radius:var(--radius);padding:10px 13px;cursor:pointer;font-weight:800;color:var(--text);background:var(--soft);border:1px solid var(--line);text-decoration:none;transition:transform .14s ease,background .14s ease,color .14s ease}.btn:hover,.tab:hover,.chip:hover,.card:hover{transform:translateY(-1px)}.primary,.tab[aria-selected=true],.chip[aria-pressed=true]{background:var(--blue2);border-color:var(--blue2);color:#fff}.ghost{background:transparent}.good{background:rgba(52,211,153,.13);color:var(--green)}.bad{background:rgba(248,113,113,.12);color:var(--red)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px}.label{color:var(--muted);font-size:.86rem}.value{display:block;margin-top:5px;font-size:1.45rem;font-weight:900}.panel{padding:16px;display:grid;gap:14px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{text-align:left;display:grid;gap:10px;padding:14px;color:var(--text);cursor:pointer}.card-title{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.muted{color:var(--muted)}.bar{height:8px;border-radius:999px;overflow:hidden;background:var(--soft)}.fill{width:var(--v,0%);height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .18s ease}.detail{display:grid;gap:14px}table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}th,td{padding:11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}th{color:var(--muted);font-size:.86rem;background:var(--soft)}.form{font-weight:900}.list{display:grid;gap:8px;padding:0;margin:0;list-style:none}.list li,.feedback,.train-card{padding:11px;border-radius:var(--radius);background:var(--soft);border:1px solid var(--line)}.train-card{min-height:260px;display:grid;align-content:center;justify-items:center;gap:16px;text-align:center;background:var(--surface);padding:24px}.prompt{display:grid;gap:6px}.prompt-main{font-size:clamp(1.6rem,6vw,3rem);font-weight:950;letter-spacing:-.04em}.input-row{width:min(520px,100%);display:grid;gap:8px}.input,.select{width:100%;min-height:46px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--text);padding:11px 12px;outline:none}.input:focus,.select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(96,165,250,.18)}.choice,.match{display:grid;gap:10px;width:min(720px,100%)}.choice{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.match-row{display:grid;grid-template-columns:1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}.ok{color:var(--green);font-weight:900}.no{color:var(--red);font-weight:900}[hidden]{display:none!important}@media(min-width:780px){.hero{padding:18px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.detail{grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr)}.match-row{grid-template-columns:1fr minmax(220px,.8fr)}}

<body>
  <main class="app">
    <div class="suite"><a class="badge" href="https://polpal1623.github.io/FrenchLibrary/">French Learning Suite</a><div class="actions"><a class="btn ghost" href="https://polpal1623.github.io/FrenchLibrary/">Все приложения</a><a class="btn ghost" href="https://github.com/PolPal1623/JeVerbs">GitHub</a></div></div>
    <header class="hero"><div class="hero-top"><div><h1>Je verbs</h1><p class="sub">10 базовых французских глаголов уровня A1-A2, 5 времён и только формы с <b>je</b>, чтобы быстрее довести их до автоматизма.</p></div><div class="actions"><button class="btn" id="themeBtn">Тема</button><button class="btn ghost" id="resetBtn">Сброс</button></div></div><nav class="tabs" aria-label="Разделы"><button class="tab" data-view="dashboard" aria-selected="true">Глаголы</button><button class="tab" data-view="training" aria-selected="false">Тренировка</button><button class="tab" data-view="test" aria-selected="false">Мини-тест</button><button class="tab" data-view="progress" aria-selected="false">Прогресс</button></nav></header>
    <section class="stats"><article class="stat"><span class="label">Выучено</span><strong class="value" id="learnedStat">0%</strong></article><article class="stat"><span class="label">Форм</span><strong class="value" id="formsStat">0/50</strong></article><article class="stat"><span class="label">Ошибок</span><strong class="value" id="errorsStat">0</strong></article><article class="stat"><span class="label">Streak</span><strong class="value" id="streakStat">0 дней</strong></article></section>
    <section class="panel" id="dashboardView"></section><section class="panel" id="detailView" hidden></section><section class="panel" id="trainingView" hidden></section><section class="panel" id="testView" hidden></section><section class="panel" id="progressView" hidden></section>
  </main>
<script>
const TENSES=[['present','Présent'],['futurProche','Futur proche'],['passeCompose','Passé composé'],['imparfait','Imparfait'],['futurSimple','Futur simple']];
const VERBS=[
{id:'etre',inf:'être',ru:'быть',f:{present:['je suis','я есть / являюсь','Je suis prêt.','Я готов.'],futurProche:['je vais être','я собираюсь быть','Je vais être à la maison.','Я буду дома.'],passeCompose:["j'ai été",'я был(а)',"J'ai été malade.",'Я был болен.'],imparfait:["j'étais",'я был(а)',"J'étais fatigué.",'Я был уставшим.'],futurSimple:['je serai','я буду','Je serai là demain.','Я буду там завтра.']}},
{id:'avoir',inf:'avoir',ru:'иметь',f:{present:["j'ai",'у меня есть',"J'ai un livre.",'У меня есть книга.'],futurProche:['je vais avoir','у меня скоро будет','Je vais avoir le temps.','У меня будет время.'],passeCompose:["j'ai eu",'у меня было',"J'ai eu une idée.",'У меня появилась идея.'],imparfait:["j'avais",'у меня было',"J'avais froid.",'Мне было холодно.'],futurSimple:["j'aurai",'у меня будет',"J'aurai besoin d'aide.",'Мне понадобится помощь.']}},
{id:'aller',inf:'aller',ru:'идти / ехать',f:{present:['je vais','я иду / еду','Je vais au travail.','Я иду на работу.'],futurProche:['je vais aller','я собираюсь пойти','Je vais aller au marché.','Я собираюсь пойти на рынок.'],passeCompose:['je suis allé(e)','я сходил(а) / ездил(а)','Je suis allé au parc.','Я ходил в парк.'],imparfait:["j'allais",'я ходил(а) / шёл',"J'allais souvent ici.",'Я часто ходил сюда.'],futurSimple:["j'irai",'я пойду / поеду',"J'irai demain.",'Я пойду завтра.']}},
{id:'faire',inf:'faire',ru:'делать',f:{present:['je fais','я делаю','Je fais mes devoirs.','Я делаю домашнее задание.'],futurProche:['je vais faire','я собираюсь сделать','Je vais faire le dîner.','Я собираюсь приготовить ужин.'],passeCompose:["j'ai fait",'я сделал(а)',"J'ai fait une pause.",'Я сделал перерыв.'],imparfait:['je faisais','я делал(а)','Je faisais du sport.','Я занимался спортом.'],futurSimple:['je ferai','я сделаю','Je ferai attention.','Я буду внимателен.']}},
{id:'dire',inf:'dire',ru:'сказать / говорить',f:{present:['je dis','я говорю','Je dis la vérité.','Я говорю правду.'],futurProche:['je vais dire','я собираюсь сказать','Je vais dire bonjour.','Я собираюсь поздороваться.'],passeCompose:["j'ai dit",'я сказал(а)',"J'ai dit merci.",'Я сказал спасибо.'],imparfait:['je disais','я говорил(а)','Je disais la même chose.','Я говорил то же самое.'],futurSimple:['je dirai','я скажу','Je dirai oui.','Я скажу да.']}},
{id:'devoir',inf:'devoir',ru:'быть должным',f:{present:['je dois','я должен / должна','Je dois partir.','Я должен уйти.'],futurProche:['je vais devoir','мне придётся','Je vais devoir attendre.','Мне придётся ждать.'],passeCompose:["j'ai dû",'мне пришлось',"J'ai dû partir tôt.",'Мне пришлось уйти рано.'],imparfait:['je devais','я должен был','Je devais travailler.','Я должен был работать.'],futurSimple:['je devrai','я должен буду','Je devrai choisir.','Я должен буду выбрать.']}},
{id:'pouvoir',inf:'pouvoir',ru:'мочь',f:{present:['je peux','я могу','Je peux aider.','Я могу помочь.'],futurProche:['je vais pouvoir','я скоро смогу','Je vais pouvoir venir.','Я смогу прийти.'],passeCompose:["j'ai pu",'я смог(ла)',"J'ai pu finir.",'Я смог закончить.'],imparfait:['je pouvais','я мог(ла)','Je pouvais comprendre.','Я мог понять.'],futurSimple:['je pourrai','я смогу','Je pourrai répondre.','Я смогу ответить.']}},
{id:'vouloir',inf:'vouloir',ru:'хотеть',f:{present:['je veux','я хочу','Je veux apprendre.','Я хочу учиться.'],futurProche:['je vais vouloir','я захочу','Je vais vouloir essayer.','Я захочу попробовать.'],passeCompose:["j'ai voulu",'я захотел(а)',"J'ai voulu comprendre.",'Я захотел понять.'],imparfait:['je voulais','я хотел(а)','Je voulais rester.','Я хотел остаться.'],futurSimple:['je voudrai','я захочу','Je voudrai parler.','Я захочу поговорить.']}},
{id:'savoir',inf:'savoir',ru:'знать / уметь',f:{present:['je sais','я знаю / умею','Je sais nager.','Я умею плавать.'],futurProche:['je vais savoir','я узнаю','Je vais savoir la réponse.','Я узнаю ответ.'],passeCompose:["j'ai su",'я узнал(а)',"J'ai su la nouvelle.",'Я узнал новость.'],imparfait:['je savais','я знал(а)','Je savais déjà.','Я уже знал.'],futurSimple:['je saurai','я буду знать','Je saurai quoi faire.','Я буду знать, что делать.']}},
{id:'prendre',inf:'prendre',ru:'брать',f:{present:['je prends','я беру','Je prends un café.','Я беру кофе.'],futurProche:['je vais prendre','я собираюсь взять','Je vais prendre le bus.','Я собираюсь сесть на автобус.'],passeCompose:["j'ai pris",'я взял(а)',"J'ai pris une photo.",'Я сделал фото.'],imparfait:['je prenais','я брал(а)','Je prenais le train.','Я ездил на поезде.'],futurSimple:['je prendrai','я возьму','Je prendrai rendez-vous.','Я запишусь на встречу.']}}
];
const STORE='jeVerbsProgress.v1',THEME='jeVerbsTheme.v1',TOTAL=VERBS.length*TENSES.length;
const views={dashboard:$('#dashboardView'),detail:$('#detailView'),training:$('#trainingView'),test:$('#testView'),progress:$('#progressView')};
const state={view:'dashboard',verb:'etre',mode:'flash',hard:false,revealed:false,item:null,test:null,data:load()};
function $(s){return document.querySelector(s)}function $$(s){return [...document.querySelectorAll(s)]}function key(v,t){return v+'|'+t}function pct(a,b){return b?Math.round(a/b*100):0}function today(){return new Date().toISOString().slice(0,10)}
function all(){return VERBS.flatMap(v=>TENSES.map(([id,label])=>{let a=v.f[id];return{key:key(v.id,id),v,t:{id,label},d:{form:a[0],ru:a[1],ex:a[2],exRu:a[3]}}}))}
function load(){let base={records:{},streak:{count:0,last:null}};try{return Object.assign(base,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch{return base}}
function save(){localStorage.setItem(STORE,JSON.stringify(state.data));updateStats()}
function rec(k){return state.data.records[k]||(state.data.records[k]={correct:0,errors:0,attempts:0,ease:2.5,interval:0,due:0,last:''})}
function touch(){let s=state.data.streak,d=today();if(s.last===d)return;if(!s.last){s.count=1}else{let prev=new Date(s.last),now=new Date(d);s.count=((now-prev)/86400000<=1.5)?s.count+1:1}s.last=d}
function learned(){return all().filter(i=>{let r=rec(i.key);return r.correct>=3&&r.interval>=3}).length}
function updateStats(){let items=all(),errs=items.reduce((n,i)=>n+rec(i.key).errors,0),l=learned();$('#learnedStat').textContent=pct(l,TOTAL)+'%';$('#formsStat').textContent=l+'/'+TOTAL;$('#errorsStat').textContent=errs;$('#streakStat').textContent=(state.data.streak.count||0)+' дней'}
function review(item,q,answer=''){let r=rec(item.key);touch();r.attempts++;r.last=today();if(q>=4){r.correct++;r.ease=Math.max(1.3,r.ease+.08);r.interval=r.interval?Math.ceil(r.interval*r.ease):1}else{r.errors++;r.correct=0;r.ease=Math.max(1.3,r.ease-.22);r.interval=0;r.lastWrong=answer}r.due=Date.now()+Math.max(1,r.interval)*86400000;save()}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").replace(/\(e\)/g,'').replace(/\s+/g,' ').trim()}function correct(i,v){return norm(v)===norm(i.d.form)}
function pool(){let items=all(),now=Date.now(),due=items.filter(i=>rec(i.key).due<=now),hard=items.filter(i=>rec(i.key).errors>0||rec(i.key).ease<2.25);return state.hard?(hard.length?hard:items):(due.length?due:items)}
function pick(){let p=pool();return p[Math.floor(Math.random()*p.length)]}
function setView(v){state.view=v;Object.values(views).forEach(x=>x.hidden=true);views[v].hidden=false;$$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));if(v==='dashboard')renderDash();if(v==='detail')renderDetail();if(v==='training')renderTrain();if(v==='test')renderTestStart();if(v==='progress')renderProgress()}
function renderDash(){views.dashboard.innerHTML=`<div class="panel-head"><div><h2>Dashboard</h2><p class="muted">Выберите глагол и закрепляйте только je-формы.</p></div><button class="btn primary" data-start>Начать тренировку</button></div><div class="grid">${VERBS.map(v=>card(v)).join('')}</div>`;views.dashboard.querySelector('[data-start]').onclick=()=>setView('training');$$('[data-verb]').forEach(b=>b.onclick=()=>{state.verb=b.dataset.verb;setView('detail')})}
function card(v){let l=TENSES.filter(([id])=>{let r=rec(key(v.id,id));return r.correct>=3&&r.interval>=3}).length;return `<button class="card" data-verb="${v.id}"><span class="card-title"><strong>${v.inf}</strong><span class="muted">${v.ru}</span></span><span class="bar"><span class="fill" style="--v:${pct(l,TENSES.length)}%"></span></span><span class="muted">${l}/${TENSES.length} форм закреплено</span></button>`}
function renderDetail(){let v=VERBS.find(x=>x.id===state.verb)||VERBS[0];views.detail.innerHTML=`<div class="panel-head"><div><h2>${v.inf}</h2><p class="muted">${v.ru} · только формы с je</p></div><div class="actions"><button class="btn ghost" data-back>Назад</button><button class="btn primary" data-add>Добавить в тренировку</button></div></div><div class="detail"><table><thead><tr><th>Время</th><th>Форма</th><th>Перевод</th><th></th></tr></thead><tbody>${TENSES.map(([id,label])=>`<tr><td>${label}</td><td class="form">${v.f[id][0]}</td><td>${v.f[id][1]}</td><td><button class="btn ghost" data-say="${v.f[id][0]}">Прослушать</button></td></tr>`).join('')}</tbody></table><div><h3>Примеры</h3><ul class="list">${TENSES.map(([id])=>`<li><strong>${v.f[id][2]}</strong><br><span class="muted">${v.f[id][3]}</span></li>`).join('')}</ul></div></div>`;views.detail.querySelector('[data-back]').onclick=()=>setView('dashboard');views.detail.querySelector('[data-add]').onclick=()=>{state.hard=false;setView('training')};$$('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say))}
function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace('(e)',''));u.lang='fr-FR';u.rate=.88;speechSynthesis.speak(u)}
function renderTrain(){state.item=state.item||pick();let i=state.item;views.training.innerHTML=`<div class="panel-head"><div><h2>Training Mode</h2><p class="muted">${pool().length} форм в очереди</p></div><div class="chips"><button class="chip" data-mode="flash" aria-pressed="${state.mode==='flash'}">Flashcards</button><button class="chip" data-mode="reverse" aria-pressed="${state.mode==='reverse'}">Reverse</button><button class="chip" data-mode="input" aria-pressed="${state.mode==='input'}">Input</button><button class="chip" data-hard aria-pressed="${state.hard}">Сложные</button></div></div><div class="train-card" id="trainCard"></div>`;$$('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.revealed=false;state.item=pick();renderTrain()});views.training.querySelector('[data-hard]').onclick=()=>{state.hard=!state.hard;state.revealed=false;state.item=pick();renderTrain()};renderTrainCard(i)}
function renderTrainCard(i){let c=$('#trainCard');if(state.mode==='input'){c.innerHTML=`<div class="prompt"><span class="muted">${i.v.inf} · ${i.t.label}</span><span class="prompt-main">${i.d.ru}</span><span class="muted">Введите французскую je-форму</span></div><form class="input-row" id="answer"><input class="input" name="a" autocomplete="off" required><button class="btn primary">Проверить</button></form><div class="feedback" id="fb" hidden></div>`;$('#answer').onsubmit=e=>{e.preventDefault();let val=e.currentTarget.a.value,ok=correct(i,val);review(i,ok?5:2,val);$('#fb').hidden=false;$('#fb').innerHTML=ok?`<span class="ok">Верно.</span> ${i.d.form}`:`<span class="no">Ошибка.</span> Правильно: <b>${i.d.form}</b>`;setTimeout(next,ok?700:1300)};c.querySelector('input').focus();return}let front=state.mode==='flash'?i.d.form:`${i.v.ru} · ${i.d.ru}`;if(!state.revealed){c.innerHTML=`<div class="prompt"><span class="muted">${i.v.inf} · ${i.t.label}</span><span class="prompt-main">${front}</span><span class="muted">${state.mode==='flash'?'Вспомните перевод':'Вспомните французскую форму'}</span></div><div class="actions"><button class="btn primary" data-show>Показать</button><button class="btn ghost" data-say>Прослушать</button></div>`;c.querySelector('[data-show]').onclick=()=>{state.revealed=true;renderTrainCard(i)};c.querySelector('[data-say]').onclick=()=>speak(i.d.form);return}c.innerHTML=`<div class="prompt"><span class="muted">${i.v.inf} · ${i.t.label}</span><span class="prompt-main">${i.d.form}</span><span class="muted">${i.d.ru}</span></div><div class="actions"><button class="btn bad" data-q="2">Сложно</button><button class="btn good" data-q="4">Помню</button><button class="btn primary" data-q="5">Легко</button><button class="btn ghost" data-say>Прослушать</button></div>`;$$('[data-q]').forEach(b=>b.onclick=()=>{review(i,+b.dataset.q);next()});c.querySelector('[data-say]').onclick=()=>speak(i.d.form)}
function next(){state.item=pick();state.revealed=false;renderTrain()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function question(type=null){return{type:type||['choice','input','match'][Math.floor(Math.random()*3)],item:all()[Math.floor(Math.random()*TOTAL)]}}
function renderTestStart(){views.test.innerHTML=`<div class="panel-head"><div><h2>Мини-тест</h2><p class="muted">Смешанные вопросы по всем je-формам.</p></div><div class="actions"><button class="btn primary" data-count="5">5 вопросов</button><button class="btn" data-count="10">10 вопросов</button></div></div>`;$$('[data-count]').forEach(b=>b.onclick=()=>startTest(+b.dataset.count))}
function startTest(n){state.test={count:n,index:0,score:0,questions:Array.from({length:n},(_,i)=>question(i%3===2?'match':null)),answers:[]};renderTestQuestion()}
function renderTestQuestion(){let t=state.test;if(!t||t.index>=t.questions.length)return renderTestResult();let q=t.questions[t.index],i=q.item,head=`<div class="panel-head"><div><h2>Вопрос ${t.index+1}/${t.count}</h2><p class="muted">${i.v.inf} · ${i.t.label}</p></div></div>`;if(q.type==='choice'){let choices=shuffle([i.d.form,...shuffle(all().filter(x=>x.key!==i.key)).slice(0,3).map(x=>x.d.form)]);views.test.innerHTML=`${head}<div class="train-card"><div class="prompt"><span class="prompt-main">${i.d.ru}</span><span class="muted">Выберите французскую форму</span></div><div class="choice">${choices.map(c=>`<button class="btn" data-choice="${c}">${c}</button>`).join('')}</div><div class="feedback" id="testFb" hidden></div></div>`;$$('[data-choice]').forEach(b=>b.onclick=()=>answerTest(b.dataset.choice===i.d.form,b.dataset.choice));return}if(q.type==='match'){let rows=shuffle(all()).slice(0,3),opts=shuffle(rows.map(r=>r.d.form));views.test.innerHTML=`${head}<div class="train-card"><div class="prompt"><span class="prompt-main">Сопоставление</span><span class="muted">Подберите форму к переводу</span></div><form class="match" id="match">${rows.map((r,n)=>`<label class="match-row"><span>${r.v.inf} · ${r.t.label}<br><b>${r.d.ru}</b></span><select class="select" name="m${n}" data-key="${r.key}"><option value="">Выберите</option>${opts.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></label>`).join('')}<button class="btn primary">Проверить</button></form><div class="feedback" id="testFb" hidden></div></div>`;$('#match').onsubmit=e=>{e.preventDefault();let ok=[...e.currentTarget.querySelectorAll('select')].every(s=>{let target=all().find(r=>r.key===s.dataset.key);review(target,s.value===target.d.form?5:2,s.value);return s.value===target.d.form});answerTest(ok,'match',true)};return}views.test.innerHTML=`${head}<div class="train-card"><div class="prompt"><span class="prompt-main">${i.d.ru}</span><span class="muted">Введите французскую je-форму</span></div><form class="input-row" id="testInput"><input class="input" name="a" autocomplete="off" required><button class="btn primary">Проверить</button></form><div class="feedback" id="testFb" hidden></div></div>`;$('#testInput').onsubmit=e=>{e.preventDefault();answerTest(correct(i,e.currentTarget.a.value),e.currentTarget.a.value)};views.test.querySelector('input').focus()}
function answerTest(ok,answer,skip=false){let t=state.test,q=t.questions[t.index],i=q.item;t.answers.push({ok,answer,correct:i.d.form,item:i});if(ok)t.score++;if(!skip)review(i,ok?5:2,String(answer||''));let fb=$('#testFb');fb.hidden=false;fb.innerHTML=q.type==='match'?(ok?'<span class="ok">Верно.</span>':'<span class="no">Есть ошибки.</span>'):(ok?`<span class="ok">Верно.</span>`:`<span class="no">Ошибка.</span> Правильно: <b>${i.d.form}</b>`);setTimeout(()=>{t.index++;renderTestQuestion()},ok?700:1400)}
function renderTestResult(){let t=state.test;views.test.innerHTML=`<div class="panel-head"><div><h2>Результат</h2><p class="muted">${t.score}/${t.count} правильных ответов</p></div><button class="btn primary" data-again>Ещё тест</button></div><ul class="list">${t.answers.map((a,n)=>`<li><b>${n+1}. ${a.item.v.inf} · ${a.item.t.label}</b><br><span class="${a.ok?'ok':'no'}">${a.ok?'верно':'ошибка'}</span><span class="muted"> · ${a.correct}</span></li>`).join('')}</ul>`;views.test.querySelector('[data-again]').onclick=renderTestStart}
function renderProgress(){let hard=all().map(i=>({i,r:rec(i.key)})).filter(x=>x.r.errors>0||x.r.ease<2.25).sort((a,b)=>b.r.errors-a.r.errors).slice(0,10);views.progress.innerHTML=`<div class="panel-head"><div><h2>Прогресс</h2><p class="muted">Выучено ${learned()} из ${TOTAL} форм.</p></div><button class="btn primary" data-hard-train>Только сложные</button></div><div class="bar"><span class="fill" style="--v:${pct(learned(),TOTAL)}%"></span></div><h3>Статистика ошибок</h3><ul class="list">${hard.length?hard.map(({i,r})=>`<li><b>${i.d.form}</b> · ${i.v.inf} · ${i.t.label}<br><span class="muted">Ошибок: ${r.errors}, попыток: ${r.attempts}, ease: ${r.ease.toFixed(2)}</span></li>`).join(''):'<li>Ошибок пока нет.</li>'}</ul>`;views.progress.querySelector('[data-hard-train]').onclick=()=>{state.hard=true;state.item=pick();setView('training')}}
$$('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#themeBtn').onclick=()=>{let next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;document.documentElement.style.colorScheme=next;localStorage.setItem(THEME,next)};$('#resetBtn').onclick=()=>{if(confirm('Сбросить локальный прогресс Je verbs?')){localStorage.removeItem(STORE);state.data=load();state.item=null;updateStats();setView('dashboard')}};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'dark';updateStats();renderDash();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
